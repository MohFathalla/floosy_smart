<!doctype html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Floosy</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #fff;
            --ink: #172033;
            --muted: #6d7585;
            --brand: #5b4bdb;
            --soft: #eeecff;
            --line: #e6e8ef;
            --green: #17854f;
            --red: #c73d4d
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Tahoma, Arial, sans-serif;
            line-height: 1.6
        }

        main {
            max-width: 1050px;
            margin: auto;
            padding: 24px 18px 50px
        }

        .top,
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .top {
            margin-bottom: 38px
        }

        .logo {
            font-size: 21px;
            font-weight: 800
        }

        .logo span,
        .number {
            color: var(--brand)
        }

        .profile {
            background: var(--soft);
            color: var(--brand);
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 12px
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 18px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px
        }

        .summary h1 {
            font-size: 42px;
            margin: 4px 0
        }

        .muted {
            color: var(--muted);
            font-size: 13px
        }

        .bar {
            height: 9px;
            background: #ececf4;
            border-radius: 10px;
            overflow: hidden;
            margin: 16px 0
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--brand)
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 18px
        }

        .stat {
            background: var(--bg);
            padding: 12px;
            border-radius: 10px
        }

        .stat b {
            display: block;
            font-size: 18px
        }

        h2 {
            font-size: 20px;
            margin: 0 0 16px
        }

        form {
            display: grid;
            gap: 11px
        }

        label {
            font-size: 13px;
            font-weight: 700
        }

        input,
        select,
        button {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 11px;
            font: inherit;
            background: #fff
        }

        button {
            background: var(--brand);
            color: #fff;
            border: 0;
            font-weight: 700;
            cursor: pointer
        }

        .message,
        .error {
            padding: 10px;
            border-radius: 9px;
            font-size: 13px;
            margin-bottom: 12px
        }

        .message {
            background: #e8f7ef;
            color: var(--green)
        }

        .error {
            background: #fff0f1;
            color: var(--red)
        }

        .section {
            margin-top: 18px
        }

        .table-wrap {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap
        }

        th,
        td {
            text-align: right;
            padding: 12px;
            border-bottom: 1px solid var(--line);
            font-size: 13px
        }

        th {
            color: var(--muted)
        }

        .amount {
            font-weight: 700
        }

        .spring {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px
        }

        .bean {
            background: var(--bg);
            border-radius: 10px;
            padding: 12px
        }

        .bean b {
            display: block;
            font-size: 13px
        }

        .bean span {
            color: var(--muted);
            font-size: 12px;
            word-break: break-all
        }

        .flow {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 14px
        }

        .flow span {
            background: var(--soft);
            color: var(--brand);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-top: 26px
        }

        @media(max-width:760px) {
            .hero {
                grid-template-columns: 1fr
            }

            .summary h1 {
                font-size: 34px
            }

            .spring {
                grid-template-columns: 1fr 1fr
            }

            .top {
                margin-bottom: 22px
            }
        }
    </style>
</head>

<body>
<main>
    <header class="top">
        <div class="logo">Floo<span>sy</span></div><span class="profile" th:text="|Profile: ${profile}|">Profile:
        dev</span>
    </header>
    <section class="hero">
        <div class="card summary"><span class="muted">إجمالي المصروفات</span>
            <h1 th:text="|${total} ${currency}|">820 EGP</h1>
            <div class="row"><span class="muted" th:text="|الميزانية ${budget} ${currency}|">الميزانية</span><b
                    class="number" th:text="|${spentPercent}%|">7%</b></div>
            <div class="bar"><i th:style="|width:${spentPercent}%|"></i></div>
            <div class="stats">
                <div class="stat" th:each="item : ${categoryTotals}"><span class="muted" th:text="${item.key}">فئة</span><b
                        th:text="|${item.value} ${currency}|">0</b></div>
            </div>
        </div>
        <div class="card">
            <h2>إضافة مصروف</h2>
            <div class="message" th:if="${message}" th:text="${message}"></div>
            <div class="error" th:if="${error}" th:text="${error}"></div>
            <form action="/expenses" method="post"><label for="description">الوصف</label><input id="description"
                                                                                                name="description" placeholder="مثال: قهوة" required><label for="amount">المبلغ</label><input id="amount"
                                                                                                                                                                                              name="amount" type="number" min="0.01" step="0.01" required><label for="category">التصنيف</label><select
                    id="category" name="category">
                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
            </select><button>حفظ المصروف</button></form>
        </div>
    </section>
    <section class="card section">
        <h2>سجل المصروفات</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>الوصف</th>
                    <th>التصنيف</th>
                    <th>التاريخ</th>
                    <th>المبلغ</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="expense : ${expenses}">
                    <td th:text="${expense.description}">مصروف</td>
                    <td th:text="${expense.category}">أخرى</td>
                    <td th:text="${expense.date}">2026-10-20</td>
                    <td class="amount" th:text="|${expense.amount} ${currency}|">0 EGP</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>

</html>
